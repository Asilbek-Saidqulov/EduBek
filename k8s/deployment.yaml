# EduBek — Kubernetes Deployment Manifests
# Phase 4D.9 — Operations
#
# Includes:
#   • Deployment (3 replicas for HA)
#   • Service (ClusterIP)
#   • HorizontalPodAutoscaler (CPU-based scaling)
#   • ConfigMap (non-secret env vars)
#   • Secret (sensitive env vars — fill in production)
#   • PodDisruptionBudget (ensure min available during node drain)
#
# Usage:
#   kubectl apply -f k8s/
#
# Prerequisites:
#   • Redis (for multi-instance Socket.IO adapter)
#   • SQLite volume OR external Postgres (set DATABASE_URL in secret)
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: edubek-config
  namespace: edubek
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  EDUBEK_COOKIE_SECURE: "true"
  EDUBEK_BCRYPT_ROUNDS: "12"

---
apiVersion: v1
kind: Secret
metadata:
  name: edubek-secrets
  namespace: edubek
type: Opaque
stringData:
  DATABASE_URL: "file:/data/edubek.db"
  EDUBEK_SESSION_SECRET: "CHANGE_ME_IN_PRODUCTION"
  EDUBEK_REFRESH_SECRET: "CHANGE_ME_IN_PRODUCTION"
  REDIS_URL: "redis://redis:6379"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edubek
  namespace: edubek
  labels:
    app: edubek
spec:
  replicas: 3
  selector:
    matchLabels:
      app: edubek
  template:
    metadata:
      labels:
        app: edubek
    spec:
      containers:
        - name: edubek
          image: edubek:latest
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: edubek-config
            - secretRef:
                name: edubek-secrets
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health/live
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          lifecycle:
            preStop:
              exec:
                command: ["node", "-e", "process.kill(process.pid, 'SIGTERM')"]
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: edubek
  namespace: edubek
spec:
  type: ClusterIP
  selector:
    app: edubek
  ports:
    - port: 80
      targetPort: 3000
      name: http

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: edubek
  namespace: edubek
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: edubek
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: edubek
  namespace: edubek
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: edubek
